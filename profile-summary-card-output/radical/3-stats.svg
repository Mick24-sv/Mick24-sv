<svg width="700" height="220" viewBox="0 0 700 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="700" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="1" stop-color="#101B2D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00FFF2"/>
      <stop offset="1" stop-color="#FF2EC4"/>
    </linearGradient>
  </defs>

  <rect width="700" height="220" rx="18" fill="url(#bg)"/>
  <rect x="20" y="18" width="660" height="184" rx="14" fill="#0F172A" stroke="#1F2D3D"/>
  <rect x="20" y="18" width="660" height="7" rx="4" fill="url(#accent)"/>

  <text x="40" y="58" fill="#E6FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">GitHub stats</text>

  <g transform="translate(40,82)">
    <rect x="0" y="0" width="190" height="72" rx="12" fill="#101B2F" stroke="#1F2D3D"/>
    <text x="18" y="24" fill="#9DB5C5" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Followers</text>
    <text x="18" y="52" fill="#E6FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">0</text>

    <rect x="208" y="0" width="190" height="72" rx="12" fill="#101B2F" stroke="#1F2D3D"/>
    <text x="226" y="24" fill="#9DB5C5" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Stars</text>
    <text x="226" y="52" fill="#E6FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">0</text>

    <rect x="416" y="0" width="190" height="72" rx="12" fill="#101B2F" stroke="#1F2D3D"/>
    <text x="434" y="24" fill="#9DB5C5" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Repos</text>
    <text x="434" y="52" fill="#E6FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">9</text>
