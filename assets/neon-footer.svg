<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="title"><title id="title">Let us build something useful ? neon signal animation</title><defs><linearGradient id="neon"><stop stop-color="#00fff2"/><stop offset=".5" stop-color="#7d5cff"/><stop offset="1" stop-color="#ff2ec4"/></linearGradient><radialGradient id="bg"><stop stop-color="#241342"/><stop offset="1" stop-color="#080e1a"/></radialGradient><filter id="glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00fff2" stroke-opacity=".07"/></pattern></defs><style>.signal{animation:signal 5s ease-in-out infinite}.signal2{animation:signal 5s ease-in-out infinite;animation-delay:-2.5s}@keyframes signal{0%,100%{opacity:.2;stroke-dashoffset:0}50%{opacity:.8;stroke-dashoffset:100}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 22H400L425 47H775L800 22H1200" stroke="url(#neon)" fill="none"/><path d="M0 40H380L410 70H790L820 40H1200" stroke="#00fff2" stroke-dasharray="50 25" fill="none" class="signal"/><path d="M0 58H360L390 88H810L840 58H1200" stroke="#ff2ec4" stroke-dasharray="30 45" fill="none" class="signal2"/><text x="600" y="122" text-anchor="middle" font-family="Consolas,monospace" font-size="14" letter-spacing="4" fill="#a78bfa">LET'S BUILD SOMETHING USEFUL.</text></svg>
