<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-labelledby="title"><title id="title">Animated cyan and magenta neon circuit divider</title><defs><linearGradient id="neon"><stop stop-color="#00fff2"/><stop offset=".5" stop-color="#7d5cff"/><stop offset="1" stop-color="#ff2ec4"/></linearGradient><radialGradient id="bg"><stop stop-color="#241342"/><stop offset="1" stop-color="#080e1a"/></radialGradient><filter id="glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00fff2" stroke-opacity=".07"/></pattern></defs><style>.a{animation:flow 7s linear infinite}.b{animation:flow 10s linear infinite reverse}@keyframes flow{from{transform:translateX(-220px)}to{transform:translateX(1400px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 14H470L480 6H720L730 14H1200" fill="none" stroke="url(#neon)" stroke-opacity=".35"/><path d="M560 14H640" stroke="#7d5cff" stroke-width="2"/><path class="a" d="M0 14H130" stroke="#00fff2" stroke-width="2" filter="url(#glow)"/><path class="b" d="M0 14H70" stroke="#ff2ec4" stroke-width="2" filter="url(#glow)"/></svg>
