<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title"><title id="title">Mick Daniel Morales ? animated neon full-stack developer banner</title><defs><linearGradient id="neon"><stop stop-color="#00fff2"/><stop offset=".5" stop-color="#7d5cff"/><stop offset="1" stop-color="#ff2ec4"/></linearGradient><radialGradient id="bg"><stop stop-color="#241342"/><stop offset="1" stop-color="#080e1a"/></radialGradient><filter id="glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00fff2" stroke-opacity=".07"/></pattern></defs><style>
.orbit{transform-origin:1010px 168px;animation:spin 32s linear infinite}.reverse{animation-direction:reverse;animation-duration:22s}.pulse{animation:pulse 4s ease-in-out infinite}.cursor{animation:blink 1.4s steps(2,end) infinite}.packet{animation:packet 7s linear infinite}.spark{animation:pulse 3s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@keyframes packet{from{transform:translateX(-160px)}to{transform:translateX(1230px)}}@keyframes float{50%{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
