<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Animated 3D technology tag globe</title>
  <desc id="desc">A glowing cyan and magenta sphere rotating with technology labels orbiting around it.</desc>

  <defs>
    <radialGradient id="globe" cx="35%" cy="28%" r="72%">
      <stop offset="0" stop-color="#253e5c"/>
      <stop offset="0.55" stop-color="#101c32"/>
      <stop offset="1" stop-color="#070b16"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00fff2"/>
      <stop offset="0.5" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#ff2ec4"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sphereClip"><circle cx="120" cy="120" r="72"/></clipPath>
  </defs>

  <style>
    .orbit { transform-origin: 120px 120px; animation: orbit 12s linear infinite; }
    .orbit-reverse { transform-origin: 120px 120px; animation: orbitReverse 17s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes orbitReverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  </style>

  <g filter="url(#glow)">
    <circle cx="120" cy="120" r="77" fill="none" stroke="url(#neon)" stroke-width="2" stroke-dasharray="3 8" opacity=".85" class="orbit"/>
    <circle cx="120" cy="120" r="84" fill="none" stroke="#00fff2" stroke-width="1" stroke-dasharray="1 12" opacity=".6" class="orbit-reverse"/>
    <circle cx="120" cy="120" r="72" fill="url(#globe)" stroke="url(#neon)" stroke-width="3"/>

    <g clip-path="url(#sphereClip)" fill="none" stroke="#00fff2" stroke-width="1" opacity=".38">
      <ellipse cx="120" cy="120" rx="72" ry="25"/>
      <ellipse cx="120" cy="120" rx="72" ry="48"/>
      <ellipse cx="120" cy="120" rx="72" ry="64"/>
      <ellipse cx="120" cy="120" rx="25" ry="72" class="orbit"/>
      <ellipse cx="120" cy="120" rx="48" ry="72" class="orbit"/>
      <ellipse cx="120" cy="120" rx="64" ry="72" class="orbit"/>
      <path d="M48 120h144M120 48v144"/>
    </g>

    <g class="orbit" font-family="monospace" font-size="8" font-weight="700" letter-spacing=".5" text-anchor="middle">
      <g fill="#00fff2">
        <text x="120" y="41">C++</text><text x="178" y="70">REACT</text>
        <text x="186" y="143">NODE</text><text x="120" y="201">PYTHON</text>
        <text x="55" y="166">JAVA</text><text x="60" y="78">VUE</text>
      </g>
      <g fill="#ff2ec4">
        <text x="147" y="55">PHP</text><text x="198" y="108">GIT</text>
        <text x="151" y="188">SQL</text><text x="80" y="195">DOCKER</text>
        <text x="42" y="123">JS</text><text x="83" y="51">R</text>
      </g>
    </g>

    <g class="orbit-reverse" font-family="monospace" font-size="7" font-weight="700" text-anchor="middle">
      <text x="120" y="120" fill="#dffcff" opacity=".9">TECH</text>
      <circle cx="120" cy="120" r="12" fill="none" stroke="#ff2ec4" stroke-width="1.5" class="pulse"/>
    </g>
  </g>
</svg>
