<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Big neon 3D globe tech tag cloud</title>
  <desc id="desc">A large animated cyber sphere with orbital technology tags and floating neon particles.</desc>

  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0f1b2f"/>
      <stop offset="50%" stop-color="#0a1221"/>
      <stop offset="100%" stop-color="#050a12"/>
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#1d2d4d"/>
      <stop offset="35%" stop-color="#101c32"/>
      <stop offset="100%" stop-color="#050b14"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00fff2"/>
      <stop offset="50%" stop-color="#7d5cff"/>
      <stop offset="100%" stop-color="#ff2ec4"/>
    </linearGradient>
    <filter id="neonGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="sphereClip"><circle cx="600" cy="335" r="162"/></clipPath>
  </defs>

  <style>
    .spin-slow { transform-box: fill-box; transform-origin: center; animation: spin-slow 18s linear infinite; }
    .spin-fast { transform-box: fill-box; transform-origin: center; animation: spin-fast 11s linear infinite reverse; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    .float { animation: floaty 5.5s ease-in-out infinite; }
    @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spin-fast { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes floaty { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    .label { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; letter-spacing: 1px; }
    .tag { font-size: 22px; }
    .tiny { font-size: 16px; }
    .section { font-size: 30px; fill: #dffcff; }
  </style>

  <rect width="1200" height="760" fill="url(#bgGlow)"/>

  <g opacity="0.9" filter="url(#neonGlow)">
    <circle cx="600" cy="335" r="255" fill="none" stroke="url(#ring)" stroke-width="2.5" stroke-dasharray="5 15" class="spin-slow"/>
    <circle cx="600" cy="335" r="286" fill="none" stroke="#00fff2" stroke-width="1.2" stroke-dasharray="1 14" class="spin-fast"/>

    <circle cx="600" cy="335" r="162" fill="url(#planet)" stroke="url(#ring)" stroke-width="4"/>

    <g clip-path="url(#sphereClip)" fill="none" stroke="#00fff2" stroke-width="1.3" opacity="0.46">
      <ellipse cx="600" cy="335" rx="162" ry="52"/>
      <ellipse cx="600" cy="335" rx="162" ry="92"/>
      <ellipse cx="600" cy="335" rx="162" ry="138"/>
      <path d="M438 335h324M600 173v324"/>
    </g>

    <g class="spin-slow" text-anchor="middle">
      <text x="600" y="92" class="section label">⚡ Core Languages</text>
      <text x="600" y="128" class="tag label" fill="#00fff2">C++</text>
      <text x="677" y="170" class="tag label" fill="#00fff2">Java</text>
      <text x="744" y="220" class="tag label" fill="#00fff2">Python</text>
      <text x="808" y="285" class="tag label" fill="#ff2ec4">PHP</text>
      <text x="780" y="355" class="tag label" fill="#00fff2">R</text>
      <text x="718" y="418" class="tag label" fill="#ffe66d">JavaScript</text>

      <text x="600" y="514" class="section label">📱 Frontend &amp; Mobile</text>
      <text x="325" y="560" class="tag label" fill="#00fff2">React</text>
      <text x="455" y="610" class="tag label" fill="#ff2ec4">React Native</text>
      <text x="620" y="645" class="tag label" fill="#00fff2">Next.js</text>
      <text x="770" y="610" class="tag label" fill="#32e6c8">Vue.js</text>
      <text x="840" y="560" class="tag label" fill="#ff2ec4">Vite</text>
      <text x="883" y="492" class="tag label" fill="#00fff2">Tailwind CSS</text>
      <text x="796" y="430" class="tag label" fill="#ff2ec4">HTML5</text>

      <text x="600" y="210" class="tiny label" fill="#dffcff" opacity=".85">TECH</text>
    </g>

    <g class="spin-fast" text-anchor="middle">
      <text x="600" y="340" class="tiny label" fill="#dffcff" opacity=".9">STACK</text>
      <circle cx="600" cy="335" r="25" fill="none" stroke="#ff2ec4" stroke-width="2.1" class="pulse"/>
    </g>

    <g class="spin-slow" text-anchor="middle">
      <text x="600" y="660" class="section label">🗄️ Backend &amp; Data</text>
      <text x="250" y="705" class="tag label" fill="#00fff2">Node.js</text>
      <text x="390" y="720" class="tag label" fill="#ffffff">Flask</text>
      <text x="538" y="735" class="tag label" fill="#48d596">Supabase</text>
      <text x="680" y="720" class="tag label" fill="#ffcd34">Firebase</text>
      <text x="820" y="705" class="tag label" fill="#00fff2">PostgreSQL</text>
      <text x="940" y="660" class="tag label" fill="#ff2ec4">MySQL</text>
      <text x="180" y="620" class="tag label" fill="#4ea94b">MongoDB</text>
      <text x="190" y="552" class="tag label" fill="#00fff2">SQLite</text>
    </g>

    <g class="spin-fast" text-anchor="middle">
      <text x="600" y="760" class="section label">🚀 Deployment &amp; Tools</text>
      <text x="225" y="170" class="tag label" fill="#00fff2">Docker</text>
      <text x="315" y="115" class="tag label" fill="#ffffff">Vercel</text>
      <text x="430" y="82" class="tag label" fill="#ff2ec4">Netlify</text>
      <text x="555" y="72" class="tag label" fill="#00fff2">Render</text>
      <text x="685" y="82" class="tag label" fill="#ff2ec4">Git</text>
      <text x="790" y="116" class="tag label" fill="#00fff2">GitHub</text>
      <text x="875" y="170" class="tag label" fill="#ff2ec4">Figma</text>
      <text x="980" y="240" class="tag label" fill="#00fff2">Notion</text>
      <text x="945" y="340" class="tag label" fill="#049fd9">Cisco</text>
      <text x="888" y="430" class="tag label" fill="#00fff2">PowerShell</text>
      <text x="785" y="500" class="tag label" fill="#ff2ec4">Bash</text>
    </g>

    <g class="spin-slow" text-anchor="middle">
      <text x="600" y="120" class="section label">🎮 Game Mode</text>
      <text x="245" y="290" class="tag label" fill="#00fff2">Unreal Engine</text>
      <text x="355" y="240" class="tag label" fill="#ffffff">Steam</text>
      <text x="470" y="210" class="tag label" fill="#ff2ec4">Riot Games</text>
      <text x="705" y="215" class="tag label" fill="#ffffff">Epic Games</text>
      <text x="865" y="285" class="tag label" fill="#76B900">NVIDIA</text>
    </g>

    <g fill="#00fff2" opacity="0.85">
      <circle cx="180" cy="135" r="2.2"/>
      <circle cx="1000" cy="120" r="2.4"/>
      <circle cx="1020" cy="510" r="2.1"/>
      <circle cx="190" cy="570" r="2.7"/>
      <circle cx="334" cy="680" r="2.1"/>
      <circle cx="855" cy="688" r="2.5"/>
      <circle cx="1015" cy="300" r="2.2"/>
      <circle cx="180" cy="355" r="2.0"/>
    </g>
  </g>
</svg>
