<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="title desc">
  <title id="title">3D globe tag cloud</title>
  <desc id="desc">Animated rotating sphere with orbiting technology labels in a cyber theme.</desc>

  <defs>
    <radialGradient id="planet" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#1d3557"/>
      <stop offset="46%" stop-color="#101c32"/>
      <stop offset="100%" stop-color="#060b14"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00fff2"/>
      <stop offset="50%" stop-color="#7d5cff"/>
      <stop offset="100%" stop-color="#ff2ec4"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="sphereClip">
      <circle cx="120" cy="120" r="74"/>
    </clipPath>
  </defs>

  <style>
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 12s linear infinite; }
    .spinReverse { transform-box: fill-box; transform-origin: center; animation: spinReverse 16s linear infinite; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinReverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; letter-spacing: 0.7px; }
  </style>

  <g filter="url(#glow)">
    <circle cx="120" cy="120" r="90" fill="none" stroke="url(#neon)" stroke-width="2" stroke-dasharray="4 10" opacity="0.82" class="spin"/>
    <circle cx="120" cy="120" r="98" fill="none" stroke="#00fff2" stroke-width="1" stroke-dasharray="1 12" opacity="0.58" class="spinReverse"/>

    <circle cx="120" cy="120" r="74" fill="url(#planet)" stroke="url(#neon)" stroke-width="3"/>

    <g clip-path="url(#sphereClip)" fill="none" stroke="#00fff2" stroke-width="1" opacity="0.38">
      <ellipse cx="120" cy="120" rx="74" ry="26"/>
      <ellipse cx="120" cy="120" rx="74" ry="46"/>
      <ellipse cx="120" cy="120" rx="74" ry="66"/>
      <path d="M46 120h148M120 46v148"/>
    </g>

    <g class="spin" text-anchor="middle">
      <text x="120" y="42" fill="#00fff2" font-size="8">C++</text>
      <text x="179" y="72" fill="#00fff2" font-size="8">REACT</text>
      <text x="188" y="143" fill="#ff2ec4" font-size="8">NODE</text>
      <text x="120" y="205" fill="#00fff2" font-size="8">PYTHON</text>
      <text x="54" y="170" fill="#00fff2" font-size="8">JAVA</text>
      <text x="56" y="82" fill="#ff2ec4" font-size="8">JS</text>
      <text x="145" y="53" fill="#ff2ec4" font-size="8">PHP</text>
      <text x="198" y="108" fill="#00fff2" font-size="8">GIT</text>
      <text x="150" y="187" fill="#00fff2" font-size="8">SQL</text>
      <text x="80" y="194" fill="#ff2ec4" font-size="8">DOCKER</text>
    </g>

    <g class="spinReverse" text-anchor="middle">
      <text x="120" y="118" fill="#dffcff" font-size="7" opacity="0.9">TECH</text>
      <circle cx="120" cy="120" r="13" fill="none" stroke="#ff2ec4" stroke-width="1.5" class="pulse"/>
    </g>
  </g>
</svg>
