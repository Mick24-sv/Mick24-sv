name: Generate Contribution Snake

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
      - scripts/prepare-snake.cjs
  schedule:
    - cron: "23 */12 * * *"  # runs every 12 hours
  workflow_dispatch:           # allows manual trigger

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#7c3aed&color_dots=#ebedf0,#c4b5fd,#a78bfa,#8b5cf6,#6d28d9
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff2ec4&color_dots=#161b22,#302b63,#6150b5,#a78bfa,#00fff2

      - name: Validate SVGs and animate empty calendars
        run: node scripts/prepare-snake.cjs

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
